<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>fluent-checkbox value attribute order</title>
  <script type="module">
    import "https://cdn.jsdelivr.net/npm/@fluentui/web-components@3.1.3/dist/web-components.min.js";
  </script>
</head>
<body>
  <form id="form">
    <fluent-checkbox name="checkedFirst" checked value="yes"></fluent-checkbox>
    <fluent-checkbox name="valueFirst" value="yes" checked></fluent-checkbox>
    <fluent-switch name="switchCheckedFirst" checked value="yes"></fluent-switch>
    <input name="native" type="checkbox" checked value="yes">
    <button type="button" id="check">Show FormData</button>
  </form>
  <pre id="out"></pre>
  <script>
    document.getElementById("check").addEventListener("click", () => {
      const data = Object.fromEntries(new FormData(document.getElementById("form")));
      document.getElementById("out").textContent = JSON.stringify(data, null, 2);
    });
  </script>
</body>
</html>
